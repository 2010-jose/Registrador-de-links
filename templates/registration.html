{% extends "base.html" %}

{% block title %}Criar conta — LinkBase{% endblock %}

{% block content %}
{# Formulário para cadastrar uma conta nova. #}
<main class="auth-page">
    <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">L</span> LinkBase
    </a>
    <section class="auth-card">
        <h1>Crie sua conta</h1>
        <p class="error">{{ error }}</p>
        <form action="{{ url_for('registration') }}" method="post" class="form-stack">
            <label for="username">Nome de usuário</label>
            <input id="username" name="username" maxlength="100" required>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="120" required>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required>
            <button class="button button-primary button-full" type="submit">Criar conta</button>
        </form>
        <p class="auth-footer">Já tem uma conta?
            <a href="{{ url_for('login') }}">Entre aqui</a>
        </p>
    </section>
</main>
{% endblock %}
